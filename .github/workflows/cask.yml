name: Update Homebrew cask
# This repository is its own Homebrew tap: Casks/ai-usage.rb follows the latest published release.
on:
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: cask
  cancel-in-progress: false
jobs:
  cask:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate the cask from the published archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$RELEASE_TAG" --pattern 'AI-Usage-*-macos-universal.zip*' --dir release-assets
          python3 scripts/generate-cask.py "$RELEASE_TAG" release-assets > Casks/ai-usage.rb
      - name: Commit to main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/ai-usage.rb
          if git diff --cached --quiet; then echo 'Cask already current.'; exit 0; fi
          git commit -m "Update Homebrew cask to $RELEASE_TAG"
          git push origin HEAD:main
